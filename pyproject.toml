[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ipam-grouping"
version = "1.0.0"
description = "NetBox plugin to group IPAM objects (IP Addresses, Prefixes, IP Ranges) and assign them to Applications with ownership-scoped editing."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Bogdan Radu" }
]
keywords = ["netbox", "plugin", "ipam", "grouping", "applications", "firewall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Topic :: System :: Networking",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/bogdan-iot/netbox-ipam-grouping"
Repository = "https://github.com/bogdan-iot/netbox-ipam-grouping"
Issues = "https://github.com/bogdan-iot/netbox-ipam-grouping/issues"

[tool.setuptools.packages.find]
include = ["netbox_ipam_grouping*"]

[tool.setuptools.package-data]
netbox_ipam_grouping = [
    "templates/**/*.html",
]
