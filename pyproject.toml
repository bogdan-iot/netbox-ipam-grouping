[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "netbox_ipam_grouping"
version = "1.0.2"
description = "NetBox plugin to group IPAM objects (IP Addresses, Prefixes, IP Ranges) and assign them to Applications with ownership-scoped editing."
readme = "README.md"
license = "Apache-2.0"
authors = [
    "Bogdan Radu"
]
keywords = ["netbox", "plugin", "ipam", "grouping", "applications", "firewall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Topic :: System :: Networking",
]
packages = [
    { include = "netbox_ipam_grouping" }
]
include = [
    "netbox_ipam_grouping/templates/**/*.html",
    "netbox_ipam_grouping/migrations/*.py",
]
homepage = "https://github.com/bogdan-iot/netbox-ipam-grouping"
repository = "https://github.com/bogdan-iot/netbox-ipam-grouping"
documentation = "https://github.com/bogdan-iot/netbox-ipam-grouping"

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.group.dev.dependencies]
twine = "*"